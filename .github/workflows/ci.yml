#
# On every push / pull request: lint all widgets and build their .plasmoid archives.
# On a "<widget>-v<version>" tag (e.g. claude-usage-v0.1.0): build that widget only
# and publish it as a GitHub release.

name: CI

on:
  push:
    branches: [main]
    tags: ["*-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch Linux ships recent Qt 6 / Plasma 6, close to what users run.
    container: archlinux:latest
    outputs:
      title: ${{ steps.release.outputs.title }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed qt6-declarative jq zip git gettext python

      - uses: actions/checkout@v4

      - name: Lint widgets
        run: PATH="/usr/lib/qt6/bin:$PATH" bash scripts/lint.sh

      - name: Check the release tag
        id: release
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          widget="${tag%-v*}"
          version="${tag##*-v}"
          meta="plasmoids/$widget/metadata.json"
          [ -f "$meta" ] || { echo "::error::No widget '$widget' for tag $tag"; exit 1; }
          actual="$(jq -r .KPlugin.Version "$meta")"
          [ "$actual" = "$version" ] || { echo "::error::Tag says $version but $meta says $actual"; exit 1; }
          echo "widget=$widget" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .KPlugin.Name "$meta") $version" >> "$GITHUB_OUTPUT"

      - name: Build .plasmoid packages
        run: bash scripts/package.sh ${{ steps.release.outputs.widget }}

      - uses: actions/upload-artifact@v4
        with:
          name: plasmoids
          path: dist/*.plasmoid

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plasmoids
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build.outputs.title }}
          files: dist/*.plasmoid
          generate_release_notes: true
